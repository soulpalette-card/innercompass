<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵墟问道 - 修仙挂机</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen bg-[#0b1020] text-slate-100">

<header class="sticky top-0 z-40 bg-[#0b1020]/95 backdrop-blur border-b border-slate-800">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
    <h1 class="font-serif-sc text-lg font-bold text-amber-300">灵墟问道</h1>
    <div class="flex items-center gap-1.5 text-sm text-amber-200">
      <span>💎</span>
      <span id="header-spirit-stones">0</span>
      <span class="text-slate-400">灵石</span>
    </div>
  </div>
  <nav class="max-w-3xl mx-auto px-4 pb-2 flex gap-2 text-sm overflow-x-auto">
    <button class="nav-btn" data-screen="main-screen">主界面</button>
    <button class="nav-btn" data-screen="character-screen">角色</button>
    <button class="nav-btn" data-screen="inventory-screen">背包</button>
    <button class="nav-btn" data-screen="techniques-screen">功法</button>
    <button class="nav-btn" data-screen="settings-screen">设置</button>
  </nav>
</header>

<main class="max-w-3xl mx-auto px-4 py-5 pb-16">

  <!-- 主界面 -->
  <section id="main-screen" class="screen space-y-4">
    <div class="panel">
      <div class="flex items-baseline justify-between">
        <div>
          <span id="realm-name" class="font-serif-sc text-2xl font-bold text-amber-300">练气</span>
          <span id="sub-level" class="ml-1 text-slate-400">第1层</span>
        </div>
        <span class="text-xs text-slate-500">修为</span>
      </div>
      <div class="progress-track mt-2">
        <div id="cultivation-bar" class="progress-fill bg-gradient-to-r from-amber-500 to-amber-300" style="width:0%"></div>
      </div>
      <div class="mt-1 text-xs text-slate-400 flex justify-between">
        <span id="cultivation-text">0 / 0</span>
        <span id="cultivation-rate">+0/秒</span>
      </div>
      <button id="breakthrough-btn" class="mt-3 w-full btn-primary" disabled>突破 (未达到条件)</button>
    </div>

    <div class="panel">
      <div class="flex items-center justify-between text-sm mb-1">
        <span class="text-slate-400">气血</span>
        <span id="hp-text">0 / 0</span>
      </div>
      <div class="progress-track">
        <div id="hp-bar" class="progress-fill bg-gradient-to-r from-rose-600 to-rose-400" style="width:100%"></div>
      </div>
    </div>

    <div class="panel">
      <div id="monster-idle" class="text-slate-400 text-sm">正在寻找妖兽的踪迹...</div>
      <div id="monster-panel" class="hidden">
        <div class="flex items-center justify-between text-sm mb-1">
          <span><span id="monster-tier-badge" class="tier-badge"></span> <span id="monster-name" class="font-medium"></span></span>
          <span id="monster-hp-text">0 / 0</span>
        </div>
        <div class="progress-track">
          <div id="monster-hp-bar" class="progress-fill bg-gradient-to-r from-emerald-600 to-emerald-400" style="width:100%"></div>
        </div>
      </div>
      <div id="rest-banner" class="hidden mt-2 text-sm text-amber-300">你受了重伤，正在闭关疗养… (<span id="rest-ticks"></span>)</div>
    </div>

    <div class="panel">
      <div class="text-xs text-slate-500 mb-2">战斗记录</div>
      <div id="combat-log" class="combat-log space-y-1 text-sm"></div>
    </div>
  </section>

  <!-- 角色 -->
  <section id="character-screen" class="screen space-y-4" style="display:none">
    <div class="panel">
      <h2 class="font-serif-sc text-lg text-amber-300 mb-3">属性</h2>
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div class="stat-row"><span>气血上限</span><span id="stat-hp"></span></div>
        <div class="stat-row"><span>攻击</span><span id="stat-atk"></span></div>
        <div class="stat-row"><span>防御</span><span id="stat-def"></span></div>
        <div class="stat-row"><span>速度</span><span id="stat-spd"></span></div>
      </div>
    </div>
    <div class="panel">
      <h2 class="font-serif-sc text-lg text-amber-300 mb-3">已装备</h2>
      <div id="equipped-slots" class="space-y-2"></div>
    </div>
    <div class="panel">
      <h2 class="font-serif-sc text-lg text-amber-300 mb-2">修炼统计</h2>
      <div class="text-sm text-slate-400 space-y-1">
        <div>击败妖兽：<span id="stat-battles-won">0</span></div>
        <div>突破成功：<span id="stat-breakthroughs">0</span></div>
        <div>突破失败：<span id="stat-breakthrough-fails">0</span></div>
      </div>
    </div>
  </section>

  <!-- 背包 -->
  <section id="inventory-screen" class="screen space-y-4" style="display:none">
    <div class="panel">
      <h2 class="font-serif-sc text-lg text-amber-300 mb-3">法宝装备</h2>
      <div id="inventory-equipment" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm"></div>
      <div id="inventory-equipment-empty" class="text-slate-500 text-sm hidden">暂无装备</div>
    </div>
    <div class="panel">
      <h2 class="font-serif-sc text-lg text-amber-300 mb-3">丹药</h2>
      <div id="inventory-consumables" class="space-y-2 text-sm"></div>
      <div id="inventory-consumables-empty" class="text-slate-500 text-sm hidden">暂无丹药</div>
    </div>
    <div class="panel">
      <h2 class="font-serif-sc text-lg text-amber-300 mb-3">炼制材料</h2>
      <div id="inventory-materials" class="text-sm text-slate-400 space-y-1"></div>
      <div id="inventory-materials-empty" class="text-slate-500 text-sm hidden">暂无材料</div>
    </div>
  </section>

  <!-- 功法 -->
  <section id="techniques-screen" class="screen space-y-4" style="display:none">
    <div class="panel">
      <h2 class="font-serif-sc text-lg text-amber-300 mb-3">功法</h2>
      <div id="techniques-list" class="space-y-2 text-sm"></div>
    </div>
  </section>

  <!-- 设置 -->
  <section id="settings-screen" class="screen space-y-4" style="display:none">
    <div class="panel">
      <h2 class="font-serif-sc text-lg text-amber-300 mb-3">游戏设置</h2>
      <label class="flex items-center justify-between text-sm">
        <span>自动突破（每达到条件立即尝试突破）</span>
        <input id="auto-breakthrough-toggle" type="checkbox" class="w-5 h-5" />
      </label>
    </div>
    <div class="panel">
      <h2 class="font-serif-sc text-lg text-amber-300 mb-3">存档管理</h2>
      <button id="export-save-btn" class="btn-secondary w-full mb-2">导出存档</button>
      <textarea id="export-save-box" readonly class="save-textarea" placeholder="点击“导出存档”生成内容"></textarea>
      <div class="mt-4">
        <textarea id="import-save-box" class="save-textarea" placeholder="粘贴存档 JSON 到这里"></textarea>
        <button id="import-save-btn" class="btn-secondary w-full mt-2">导入存档</button>
      </div>
      <button id="reset-save-btn" class="btn-danger w-full mt-4">重置存档</button>
    </div>
  </section>

</main>

<!-- 突破弹窗 -->
<div id="breakthrough-modal" class="modal-overlay hidden">
  <div class="modal-box text-center">
    <h3 class="font-serif-sc text-xl text-amber-300 mb-4">突破</h3>
    <div class="card-container mx-auto" id="breakthrough-card">
      <div class="card-inner">
        <div class="card-front flex items-center justify-center bg-slate-800 border border-amber-500/40">
          <span class="text-4xl">☯</span>
        </div>
        <div class="card-back flex items-center justify-center" id="breakthrough-result-face">
          <span id="breakthrough-result-text" class="text-lg font-bold"></span>
        </div>
      </div>
    </div>
    <p id="breakthrough-chance-text" class="text-sm text-slate-400 mt-4"></p>
    <div class="flex gap-2 mt-4">
      <button id="breakthrough-confirm-btn" class="btn-primary flex-1">尝试突破</button>
      <button id="breakthrough-close-btn" class="btn-secondary flex-1 hidden">关闭</button>
    </div>
  </div>
</div>

<!-- 掉落弹窗 -->
<div id="loot-modal" class="modal-overlay hidden">
  <div class="modal-box text-center">
    <h3 class="font-serif-sc text-xl text-amber-300 mb-4">珍稀掉落</h3>
    <div class="card-container mx-auto flipped">
      <div class="card-inner">
        <div class="card-front"></div>
        <div class="card-back flex flex-col items-center justify-center bg-gradient-to-br from-amber-600 to-amber-300 text-slate-900">
          <span class="text-3xl mb-2">✦</span>
          <span id="loot-item-name" class="font-bold"></span>
        </div>
      </div>
    </div>
    <button id="loot-close-btn" class="btn-primary w-full mt-4">收下</button>
  </div>
</div>

<!-- 离线收益弹窗 -->
<div id="offline-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 class="font-serif-sc text-xl text-amber-300 mb-3 text-center">离线收益</h3>
    <p class="text-sm text-slate-400 text-center mb-4">你离开了 <span id="offline-duration"></span></p>
    <div class="space-y-1.5 text-sm">
      <div class="stat-row"><span>获得修为</span><span id="offline-cultivation"></span></div>
      <div class="stat-row"><span>获得灵石</span><span id="offline-stones"></span></div>
      <div class="stat-row"><span>击败妖兽</span><span id="offline-kills"></span></div>
      <div class="stat-row"><span>离线突破</span><span id="offline-breakthroughs"></span></div>
    </div>
    <button id="offline-close-btn" class="btn-primary w-full mt-4">收下收益</button>
  </div>
</div>

<script src="js/namespace.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/combat.js"></script>
<script src="js/offline.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
